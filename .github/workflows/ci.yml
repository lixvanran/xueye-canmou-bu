name: CI

on:
  push:
    branches: [main, 'fix/**', 'chore/**', 'feat/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一分支的新 push 取消旧任务
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端 (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 装依赖
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          # requirements.txt 已钉死版本 (v1.2.4) —— CI 装的就是用户本地那套
          pip install -r requirements.txt
          pip install pytest

      - name: 语法检查
        working-directory: backend
        run: python -m compileall -q app tests

      - name: 跑测试
        working-directory: backend
        # 测试全部离线: 不需要 LLM key, 不发网络请求
        env:
          LLM_API_KEY: ''
          LLM_BASE_URL: https://openrouter.ai/api/v1
        run: pytest -q --tb=short

      - name: 工具 schema 一致性自检
        working-directory: backend
        # TOOLS 与 TOOL_REGISTRY 不一致 ⇒ LLM 调不到某个工具 (v1.2.3 的日程工具就是这么丢的)
        run: |
          python -c "
          from app.agent.prompts.tools import TOOLS
          from app.agent.tools.registry import TOOL_REGISTRY
          declared = {t['function']['name'] for t in TOOLS}
          registered = set(TOOL_REGISTRY)
          assert registered <= declared, f'registry 有但 LLM 调不到: {sorted(registered - declared)}'
          assert declared <= registered, f'schema 有但未注册: {sorted(declared - registered)}'
          print(f'OK: {len(declared)} 个工具, schema 与 registry 一致')
          "

  frontend:
    name: 前端 (tsc + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 装依赖
        working-directory: frontend
        run: npm ci

      - name: 类型检查
        working-directory: frontend
        run: npx tsc --noEmit

      - name: 构建
        working-directory: frontend
        run: npm run build
